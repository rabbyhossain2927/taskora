name: Build & publish TaskOra web

# Builds the website version and puts taskora-web.zip on the "web-latest"
# GitHub release. Your server (taskora-api/web_update.php) then installs it
# into taskora.rabbyhossain.com automatically.
on:
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'pubspec.yaml', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Build the website
        run: |
          flutter pub get
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          LATEST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v?([^"]+)".*/\1/')
          [ -n "$LATEST" ] && V="$LATEST"
          echo "Building web version $V"
          flutter build web --release --build-name="$V" --build-number=${{ github.run_number }} --pwa-strategy=offline-first

      - name: Pack it
        run: |
          cd build/web
          mv htaccess.txt .htaccess
          zip -qr ../../taskora-web.zip . -x '*.map'
          cd ../..
          ls -la taskora-web.zip

      - name: Publish to the web-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view web-latest >/dev/null 2>&1; then
            gh release create web-latest --prerelease --latest=false --title "TaskOra web (latest build)" \
              --notes "Website build. Installed automatically on taskora.rabbyhossain.com. Not an app update."
          fi
          gh release upload web-latest taskora-web.zip --clobber

      - name: Tell the server to install it
        run: |
          sleep 5
          curl -s -m 200 https://rabbyhossain.com/taskora-api/web_update.php || true
