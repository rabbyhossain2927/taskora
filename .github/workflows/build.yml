name: Build & release TaskOra

# How to publish an update (see SETUP-GUIDE.md, part 7):
#   1. Write what changed in RELEASE_NOTES.md
#   2. Actions tab > "Build & release TaskOra" > Run workflow > type the new version (e.g. 1.0.3)
#      (or push a git tag like v1.0.3)
#   3. This builds the APK and publishes a GitHub Release.
#      Every installed TaskOra sees it and shows "Update ready".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 1.0.3 (must be higher than the last one)'
        required: true
      publish:
        description: 'Publish it so phones get the update'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Add the standard Android project files
        # Only creates files that are missing; our own build.gradle,
        # AndroidManifest.xml and icons are kept.
        run: |
          flutter create --org com.taskora --project-name taskora --platforms=android .
          # Newer Kotlin so recent Firebase/AndroidX libraries compile.
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/settings.gradle
          cat android/settings.gradle

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.publish }}" == "true" ]]; then
              echo "::error::Add the 4 signing secrets (Settings > Secrets and variables > Actions) before publishing a release."
              exit 1
            fi
            echo "::warning::No KEYSTORE_BASE64 secret - test build with a temporary key (not published)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Work out the version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [[ -z "$V" && "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME}"; fi
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.0.3 (got '$V')"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building TaskOra $V (build ${{ github.run_number }})"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name="${{ steps.ver.outputs.version }}" --build-number="${{ github.run_number }}"

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "TaskOra-v${{ steps.ver.outputs.version }}.apk"

      - name: Keep the APK as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: TaskOra-v${{ steps.ver.outputs.version }}
          path: TaskOra-v${{ steps.ver.outputs.version }}.apk

      - name: Publish the GitHub Release (this is what the app checks)
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TaskOra ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: TaskOra-v${{ steps.ver.outputs.version }}.apk
