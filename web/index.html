<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskOra — projects, to-dos and notes in one place. Synced with your phone.">
  <meta name="theme-color" content="#7054FB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TaskOra">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>TaskOra</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F6F6FA; }
    @media (prefers-color-scheme: dark) { html, body { background: #111117; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 0 0, #FCE9FF, transparent 60%), radial-gradient(circle at 100% 0, #DFF0FF, transparent 60%), #F8F7FF; color: #16161D;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease;
    }
    #splash img { width: 92px; height: 92px; border-radius: 30px; box-shadow: 0 12px 30px rgba(112,84,251,.25); animation: pop .8s cubic-bezier(.2,1.4,.4,1); }
    #splash h1 { margin: 20px 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.6px; }
    #splash p { margin: 0; font-size: 13.5px; opacity: .75; }
    #splash .bar { width: 120px; height: 4px; margin-top: 28px; border-radius: 4px; background: #E6E1FF; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #7054FB; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <h1>Task<span style="color:#7054FB">Ora</span></h1>
    <p>Projects · To-dos · Notes</p>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
