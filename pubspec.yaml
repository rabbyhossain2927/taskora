name: taskora
description: TaskOra - projects, to-dos and notes in one calm place.
publish_to: 'none'

# The CI build overrides this with the git tag (v1.0.3 -> 1.0.3) and the run number.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_slidable: ^3.1.1
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  file_picker: ^8.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
